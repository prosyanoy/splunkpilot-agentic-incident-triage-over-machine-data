[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splunkpilot"
version = "0.1.0"
description = "Agentic incident triage over Splunk-style machine data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
splunkpilot = "splunkpilot.cli:main"

[tool.setuptools.packages.find]
include = ["splunkpilot*"]

[tool.setuptools.package-data]
splunkpilot = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
